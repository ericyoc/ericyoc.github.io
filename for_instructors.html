<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Adoption Guide | The Adaptive AI Codex Series | Eric Yocam</title>
  <meta name="description" content="Multi-tiered adoption guide for The Adaptive AI Codex Series by Eric Yocam PhD, DBA. Comprehensive instructor, department, and school integration resources."/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --navy: #0f2340;
      --navy-mid: #1a3558;
      --gold: #c8983a;
      --gold-light: #e8b85a;
      --light: #f4f6f9;
      --white: #ffffff;
      --text: #2c3e50;
      --muted: #6b7a8d;
      --border: #dde3ec;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Source Sans 3', sans-serif;
      background: var(--light);
      color: var(--text);
      line-height: 1.65;
    }
    nav {
      background: var(--navy);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,.35);
    }
    nav .brand {
      color: var(--white);
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: .02em;
      text-decoration: none;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 1.6rem;
      flex-wrap: wrap;
      align-items: center;
    }
    nav ul li a {
      color: rgba(255,255,255,.75);
      text-decoration: none;
      font-size: .82rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      transition: color .2s;
    }
    nav ul li a:hover { color: var(--gold-light); }
    .page-wrapper {
      max-width: 960px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }
    .breadcrumb {
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .breadcrumb a {
      color: var(--gold);
      text-decoration: none;
    }
    .breadcrumb a:hover { text-decoration: underline; }
    .card {
      background: var(--white);
      border-radius: 10px;
      padding: 2.2rem 2.4rem;
      box-shadow: 0 2px 16px rgba(0,0,0,.07);
      margin-bottom: 1.6rem;
    }
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      color: var(--navy);
      border-bottom: 2px solid var(--gold);
      padding-bottom: .5rem;
      margin-bottom: 1.2rem;
    }
    .card p {
      font-size: .95rem;
      color: var(--text);
      line-height: 1.75;
      margin-bottom: 1rem;
    }
    .card p:last-child { margin-bottom: 0; }
    .features-list {
      list-style: none;
      margin: .5rem 0;
    }
    .features-list li {
      display: flex;
      align-items: flex-start;
      gap: .7rem;
      padding: .6rem 0;
      border-bottom: 1px solid var(--border);
      font-size: .93rem;
    }
    .features-list li:last-child { border-bottom: none; }
    .features-list li i {
      color: var(--gold);
      margin-top: 4px;
      flex-shrink: 0;
    }
    .highlight-box {
      background: #fdf8ee;
      border-left: 4px solid var(--gold);
      padding: 1.2rem 1.5rem;
      border-radius: 0 8px 8px 0;
      margin: 1.2rem 0;
    }
    .highlight-box p { margin-bottom: 0; font-size: .92rem; color: var(--navy); }
    .book-callout {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.2rem;
      background: #fafbfc;
    }
    .book-callout h3 {
      font-family: 'Playfair Display', serif;
      color: var(--navy);
      font-size: 1.1rem;
      margin-bottom: .4rem;
    }
    .tier-button-group {
      display: flex;
      flex-wrap: wrap;
      gap: .8rem;
      margin-top: 1.4rem;
    }
    .tier-btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      background: var(--navy);
      color: var(--gold-light);
      font-weight: 700;
      font-size: .85rem;
      padding: .6rem 1.2rem;
      border-radius: 6px;
      text-decoration: none;
      border: 1.2px solid var(--gold);
      transition: background .2s, color .2s, transform .15s;
    }
    .tier-btn:hover {
      background: var(--gold);
      color: var(--navy);
      transform: translateY(-1px);
    }
    .back-series-btn {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      background: var(--gold);
      color: var(--navy);
      font-weight: 700;
      font-size: .92rem;
      padding: .75rem 1.8rem;
      border-radius: 7px;
      text-decoration: none;
      transition: background .2s, transform .15s;
    }
    .back-series-btn:hover {
      background: var(--gold-light);
      transform: translateY(-1px);
    }
    footer {
      text-align: center;
      padding: 2rem;
      font-size: .8rem;
      color: var(--muted);
    }
    @media (max-width: 680px) {
      nav ul { gap: 1rem; }
      .card { padding: 1.5rem; }
      .tier-button-group { flex-direction: column; }
    }
  </style>
</head>
